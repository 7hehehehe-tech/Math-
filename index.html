for(let i=1;i<=5;i++){let m=i+1,b=i+2,x=i,y=m*x+b;add(6,'點 ('+x+','+y+') 在 y='+m+'x+'+b+' 上嗎？','是',['否','只能 x=0','資訊不足'],'代入點的 x 和 y 判斷。',m+'×'+x+'+'+b+'='+y+'，所以在直線上。')}
for(let i=1;i<=5;i++){let a=30+i*5,b=40+i*3,c=180-a-b;add(7,'三角形兩內角為 '+a+'° 和 '+b+'°，第三角為何？',c+'°',[(c+10)+'°',(c-10)+'°',(a+b)+'°'],'三內角和 180°。','180−'+a+'−'+b+'='+c+'°。')}
for(let i=1;i<=5;i++){let a=20+i*5,b=40+i*4,v=a+b;add(7,'三角形兩個不相鄰內角為 '+a+'°、'+b+'°，其外角為何？',v+'°',[(v+10)+'°',(180-v)+'°',(v-10)+'°'],'外角等於不相鄰兩內角和。',a+'+'+b+'='+v+'°。')}
for(let i=1;i<=5;i++){let a=i+3,b=i+4,c=i+6;add(7,'三邊為 '+a+'、'+b+'、'+c+'，能組成三角形嗎？','可以',['不可以','只可組直角','資訊不足'],'檢查較短兩邊之和是否大於最長邊。',a+'+'+b+'>' +c+'，所以可以。')}
for(let i=1;i<=5;i++){let a=30+i*7,b=50+i*3,c=180-a-b;add(7,'三角形 ABC 與 DEF 全等，A 對應 D，B 對應 E。若 ∠A='+a+'°、∠B='+b+'°，∠F 為何？',c+'°',[(c+5)+'°',(c+10)+'°',(c+15)+'°'],'全等三角形對應角相等，先求 C。','∠C=180−'+a+'−'+b+'='+c+'°，對應 ∠F='+c+'°。')}
for(let i=1;i<=5;i++){let a=30+i*8;add(8,'兩條平行線被截線所截，一個同位角為 '+a+'°，另一同位角是多少？',a+'°',[(180-a)+'°',(a+10)+'°',(a-10)+'°'],'平行線同位角相等。','另一同位角也是 '+a+'°。')}
for(let i=1;i<=5;i++){let a=40+i*9,b=180-a;add(8,'平行四邊形的一內角為 '+a+'°，鄰角為何？',b+'°',[(b+10)+'°',(b+20)+'°',(b+30)+'°'],'平行四邊形鄰角互補。','180−'+a+'='+b+'°。')}
for(let i=1;i<=5;i++){let a=2*i+4,b=2*i+8,m=(a+b)/2;add(8,'梯形上底 '+a+'、下底 '+b+'，中線長為何？',m,[a+b,m+1,b],'梯形中線=(上底+下底)÷2。','('+a+'+'+b+')÷2='+m+'。')}
for(let i=1;i<=5;i++){let a=2*i+4,b=i+2,p=2*(a+b);add(8,'平行四邊形相鄰邊長 '+a+'、'+b+'，周長為何？',p,[a+b,p+2,p+4],'對邊等長，所以周長=2×(相鄰兩邊和)。','2×('+a+'+'+b+')='+p+'。')}
if(bank.some((b,i)=>{if(b.length!==20)throw Error("章節 "+i+" 只有 "+b.length+" 題");return false})){}
let state={done:{},wrong:{}};try{state=Object.assign(state,JSON.parse(localStorage.getItem("math-year-v1")||"{}"))}catch{}
let unit=0,index=0,selected=null,submitted=false,showReview=false,feedback="";
const $=id=>document.getElementById(id),escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function save(){try{localStorage.setItem("math-year-v1",JSON.stringify(state))}catch{}}
function id(u,i){return u+"-"+i}
function nav(){let last="",s="";units.forEach((u,j)=>{if(u[0]!==last){last=u[0];s+='<div class="semester">'+last+'</div>'}let n=Object.keys(state.done).filter(x=>x.startsWith(j+"-")).length;s+='<button class="chapter '+(!showReview&&j===unit?"active":"")+'" data-unit="'+j+'">'+(j+1)+'. '+escapeHTML(u[1])+'<small>'+n+'/20 題已完成</small></button>'});$("nav").innerHTML=s;document.querySelectorAll("[data-unit]").forEach(b=>b.onclick=()=>{unit=Number(b.dataset.unit);index=0;showReview=false;reset();render()})}
function reset(){selected=null;submitted=false;feedback=""}
function q(){return bank[unit][index]}
function optionsFor(u,i){let opts=bank[u][i].options.slice(),seed=(u+1)*100+i+3;for(let j=opts.length-1;j>0;j--){seed=(seed*1664525+1013904223)>>>0;let k=seed%(j+1);[opts[j],opts[k]]=[opts[k],opts[j]]}return opts}
function stats(u){let done=bank[u].filter((_,i)=>state.done[id(u,i)]).length,correct=bank[u].filter((_,i)=>state.done[id(u,i)]==="correct").length;return [done,correct,20-done]}
function render(){nav();if(showReview){renderReview();return}let u=units[unit],p=stats(unit),qq=q(),opts=optionsFor(unit,index),stage=index<8?"基礎":index<15?"熟練":"挑戰";let pick=selected;
$("content").innerHTML='<div class="stage">'+u[0]+' · 第 '+(unit+1)+' 章</div><h2>'+escapeHTML(u[1])+'</h2><p class="muted">'+escapeHTML(u[2])+'</p><section class="overview"><h3>🧭 單元大綱：先了解這章在做什麼</h3><p><b>🌱 這章在學什麼？</b><br>'+escapeHTML(outlines[unit][0])+'</p><p><b>🏡 生活中的例子</b><br>'+escapeHTML(outlines[unit][1])+'</p><p><b>🪜 學習路線</b><br>'+escapeHTML(outlines[unit][2])+'</p><p><b>🎯 學完會做到</b><br>'+escapeHTML(outlines[unit][3])+'</p><p class="muted" style="font-size:13px">先看懂大綱，再往下讀觀念與範例，最後完成本章 20 題練習。</p></section><div class="lesson"><strong>📖 觀念教學</strong><div class="formula">'+escapeHTML(u[3])+'</div><ol>'+u[4].map(x=>'<li>'+escapeHTML(x)+'</li>').join("")+'</ol></div><div class="examples"><b>✏️ 範例</b>'+u[5].map(x=>'<div>'+escapeHTML(x)+'</div>').join("")+'</div><div class="metrics"><div class="metric">已練習<b>'+p[0]+'/20</b></div><div class="metric">答對<b>'+p[1]+'</b></div><div class="metric">尚未練習<b>'+p[2]+'</b></div></div><div class="progress"><div style="width:'+(p[0]*5)+'%"></div></div><hr style="border:0;border-top:1px solid #e4edf4;margin:20px 0"><div class="stage">第 '+(index+1)+'/20 題 · '+stage+'</div><div class="question">'+escapeHTML(qq.q)+'</div><div class="choices">'+opts.map((o,j)=>'<button class="choice '+(pick===o?"selected ":"")+(submitted?(o===qq.a?"correct":pick===o?"incorrect":""):"")+'" data-opt="'+j+'" '+(submitted?'disabled':'')+'>'+String.fromCharCode(65+j)+'. '+escapeHTML(o)+'</button>').join("")+'</div><div class="buttons"><button class="button" id="check" '+(submitted||selected===null?"disabled":"")+' >確認答案</button><button class="button alt" id="hint">提示</button><button class="button alt" id="solution">看詳解</button></div><div id="feedback" aria-live="polite"></div><div class="buttons"><button class="button alt" id="previous" '+(index===0?"disabled":"")+'>← 上一題</button><button class="button" id="next">'+(index===19?"下一章 →":"下一題 →")+'</button></div><p class="muted" style="font-size:12px">提示和詳解不會替你作答；答題結果會記錄在本機。</p>';
document.querySelectorAll("[data-opt]").forEach(b=>b.onclick=()=>{selected=opts[Number(b.dataset.opt)];render()});
$("check").onclick=()=>{if(selected===null)return;submitted=true;let key=id(unit,index),right=selected===qq.a;state.done[key]=right?"correct":"wrong";if(right)delete state.wrong[key];else state.wrong[key]=true;save();feedback=(right?"✅ 答對了！":"再試著理解這題：正確答案為 "+qq.a+"。")+"<br>"+qq.why;render()};
$("hint").onclick=()=>{$("feedback").className="feedback";$("feedback").textContent="💡 提示："+qq.h};
$("solution").onclick=()=>{$("feedback").className="feedback";$("feedback").textContent="📖 詳解："+qq.why+"　答案："+qq.a};
$("previous").onclick=()=>{if(index>0){index--;reset();render()}};
$("next").onclick=()=>{if(index===19){unit=(unit+1)%units.length;index=0}else index++;reset();render()};
if(submitted){$("feedback").className="feedback "+(selected!==qq.a?"wrong":"");$("feedback").innerHTML=feedback} }
function renderReview(){let errors=Object.keys(state.wrong).filter(k=>state.wrong[k]).sort((a,b)=>{let [u,i]=a.split("-").map(Number),[v,j]=b.split("-").map(Number);return u-v||i-j});$("content").innerHTML='<h2>📝 我的錯題本</h2><p class="muted">點一題就能回到原章節重新練習。答對後會從錯題本移除。</p><p><b>目前 '+errors.length+' 題待複習</b></p>'+(errors.length?errors.map(key=>{let [u,i]=key.split("-").map(Number);return '<button class="chapter" data-review="'+key+'">'+escapeHTML(units[u][1])+' · 第 '+(i+1)+' 題：'+escapeHTML(bank[u][i].q)+'</button>'}).join(""):'<div class="lesson">目前沒有需要複習的錯題！</div>');document.querySelectorAll("[data-review]").forEach(b=>b.onclick=()=>{let [u,i]=b.dataset.review.split("-").map(Number);unit=u;index=i;showReview=false;reset();render()})}
$("mistakeButton").onclick=()=>{showReview=true;render()};render();
</script></body></html>
