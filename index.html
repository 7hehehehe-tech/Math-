<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>數學慢慢來｜國二數學練習室</title>
<style>
:root{font-family:system-ui,-apple-system,'Noto Sans TC',sans-serif;color:#24334a;background:#f5f8ff}*{box-sizing:border-box}body{margin:0}header{background:linear-gradient(120deg,#3659ad,#6976d8);color:white;padding:30px max(20px,calc((100vw - 1060px)/2))}header h1{margin:0 0 8px;font-size:clamp(26px,4vw,38px)}header p{margin:0;opacity:.95}.wrap{max-width:1060px;margin:22px auto;padding:0 18px}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}.panel{background:white;border:1px solid #e2e8f4;border-radius:18px;padding:22px;box-shadow:0 6px 22px #283f7410}.sidebar h2,.panel h2{font-size:19px;margin:0 0 14px}.units{display:grid;gap:9px}button{font:inherit;cursor:pointer;border:0;border-radius:11px;padding:11px 14px;font-weight:650}button:focus-visible,input:focus-visible{outline:3px solid #f9b43b;outline-offset:2px}.unit{background:#f0f3ff;color:#2d448a;text-align:left}.unit.active{background:#3f5fc0;color:white}.muted{color:#66738b;font-size:14px}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.tab{background:#eef2fa;color:#385080}.tab.active{background:#355bb3;color:#fff}.lesson{background:#f3f6ff;border-radius:13px;padding:17px;line-height:1.9}.lesson strong{color:#294ca4}.question{font-size:22px;font-weight:750;margin:20px 0}.answers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.answer{background:#f3f6ff;color:#25385e;border:2px solid transparent;text-align:left}.answer:hover{background:#e9efff}.answer.selected{border-color:#5374d4}.answer.correct{border-color:#2e9b73;background:#e4f8ee}.answer.wrong{border-color:#d96a6a;background:#fff0f0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.primary{background:#355bb3;color:white}.secondary{background:#eaf0ff;color:#2d4d9b}.feedback{margin-top:15px;border-radius:12px;padding:14px;background:#eef7ff;line-height:1.8}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat{background:#f1f5ff;padding:14px;border-radius:12px;text-align:center}.stat b{font-size:24px;color:#3659ad}.stat span{display:block;font-size:13px;color:#66738b}.pill{display:inline-block;background:#e9efff;color:#355bb3;padding:5px 10px;border-radius:30px;font-size:13px}.small{font-size:13px}.empty{color:#66738b}.footer{text-align:center;padding:30px;color:#66738b}.hidden{display:none}select{font:inherit;padding:9px;border:1px solid #cbd5e1;border-radius:9px;background:white}ul{padding-left:22px}li{margin:7px 0}@media(max-width:740px){.layout{grid-template-columns:1fr}.panel{padding:17px}.answers{grid-template-columns:1fr}.stats{gap:6px}.stat{padding:10px 5px}.stat b{font-size:20px}}
</style>
</head>
<body>
<header><h1>📘 數學慢慢來</h1><p>國二數學練習室｜先弄懂，再練習；每天進步一點點。</p></header>
<div class="wrap"><div class="layout">
<aside class="panel sidebar"><h2>📚 選擇單元</h2><div id="units" class="units"></div><p class="muted">依台灣國中常見八年級主題設計，實際教學順序依學校版本而異。</p></aside>
<main class="panel"><div class="stats"><div class="stat"><b id="attempts">0</b><span>累計作答</span></div><div class="stat"><b id="correct">0</b><span>答對題數</span></div><div class="stat"><b id="accuracy">0%</b><span>正確率</span></div></div>
<div class="tabs"><button class="tab active" data-tab="learn">📖 觀念教學</button><button class="tab" data-tab="practice">✏️ 互動練習</button><button class="tab" data-tab="mistakes">🔁 錯題複習</button></div>
<section id="learn"><h2 id="lessonTitle"></h2><div id="lessonBody" class="lesson"></div><div class="actions"><button class="primary" id="startPractice">開始練習 →</button></div></section>
<section id="practice" class="hidden"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><span class="pill" id="unitLabel"></span><label>難度 <select id="level"><option value="basic">基礎</option><option value="advanced">進階</option></select></label></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="actions"><button class="secondary" id="hint">💡 看提示</button><button class="secondary" id="explain">📖 看詳解</button><button class="primary" id="next">下一題 →</button></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><p class="muted small">提示和詳解不會算作答對；答錯的題目會加入錯題本。</p></section>
<section id="mistakes" class="hidden"><h2>我的錯題本</h2><p class="muted">錯題儲存在這台裝置的瀏覽器中。換裝置或清除瀏覽資料可能遺失紀錄。</p><div id="mistakeList"></div><button class="secondary" id="clearMistakes">清空錯題本</button></section>
</main></div></div><div class="footer">為練習而設計，無廣告、無帳號需求。一起慢慢學會數學 ✨</div>
<script>
'use strict';
const data=[
{id:'root',name:'平方根與畢氏定理',lesson:'<strong>平方根</strong>：因為 3 × 3 = 9，所以 √9 = 3。注意 √9 代表非負的平方根。<br><strong>畢氏定理</strong>：直角三角形的兩股長 a、b，斜邊 c，滿足 a² + b² = c²。<br>例：兩股是 3、4，斜邊就是 √(9+16) = 5。',q:[['√49 = ?', ['7','-7','14','49'],0,'想想哪個非負數乘自己會等於 49。','7 × 7 = 49，因此 √49 = 7。'],['直角三角形兩股為 6 和 8，斜邊長多少？',['10','12','14','7'],0,'使用 a² + b² = c²。','6² + 8² = 36 + 64 = 100，√100 = 10。'],['√81 + √16 = ?',['13','9','25','5'],0,'先各自開根號，再相加。','√81 = 9，√16 = 4，所以 9 + 4 = 13。'],['直角三角形斜邊為 13，一股為 5，另一股為？',['12','8','18','10'],0,'另一股平方 = 斜邊平方 − 已知股平方。','13² − 5² = 169 − 25 = 144，所以另一股是 12。']]},
{id:'factor',name:'因式分解',lesson:'<strong>提公因式</strong>：6x + 9 = 3(2x + 3)，因為兩項都有 3。<br><strong>平方差公式</strong>：a² − b² = (a+b)(a−b)。<br>例：x² − 16 = (x+4)(x−4)。',q:[['6x + 12 提出公因式後是？',['6(x + 2)','6(x + 12)','x(6 + 12)','12(x + 6)'],0,'6x 與 12 都可以除以 6。','6x ÷ 6 = x，12 ÷ 6 = 2，所以是 6(x + 2)。'],['x² − 9 = ?',['(x+3)(x−3)','(x−9)(x+1)','(x−3)²','(x+9)(x−1)'],0,'9 = 3²，套用平方差公式。','x² − 3² = (x+3)(x−3)。'],['4x + 8 = ?',['4(x+2)','2(x+8)','4(x+8)','x(4+8)'],0,'兩項都能除以 4。','提出 4 得 4(x+2)。'],['x² + 5x + 6 = ?',['(x+2)(x+3)','(x+1)(x+6)','(x−2)(x−3)','(x+5)(x+1)'],0,'找兩數相乘為 6、相加為 5。','2 × 3 = 6，2 + 3 = 5，所以 (x+2)(x+3)。']]},
{id:'quadratic',name:'一元二次方程式',lesson:'<strong>一元二次方程式</strong>含有 x²，例：x² − 5x + 6 = 0。<br>先因式分解：(x−2)(x−3) = 0。<br>因為兩數相乘為 0，至少一個因數為 0，所以 x = 2 或 x = 3。',q:[['x² = 25，x 是？',['5 或 −5','只有 5','只有 −5','25'],0,'正數和負數平方後都可能等於 25。','5² = 25，(−5)² = 25，因此 x = ±5。'],['(x−2)(x−4)=0，x 是？',['2 或 4','−2 或 −4','6','8'],0,'乘積為 0 時，至少一個因數為 0。','x−2=0 或 x−4=0，所以 x=2 或 4。'],['x² − 9 = 0，x 是？',['3 或 −3','只有 3','9','0'],0,'移項後 x² = 9。','x²=9，因此 x=±3。'],['x² − 7x + 12 = 0，x 是？',['3 或 4','−3 或 −4','2 或 6','1 或 12'],0,'找兩數相乘 12、相加 7。','(x−3)(x−4)=0，所以 x=3 或 4。']]},
{id:'sequence',name:'等差數列',lesson:'<strong>等差數列</strong>：相鄰兩項的差固定，稱為公差 d。<br>例：2、5、8、11，公差為 3。<br>第 n 項公式：aₙ = a₁ + (n−1)d。',q:[['2、5、8、11，下一項是？',['14','12','13','15'],0,'每次增加多少？','每次 +3，所以 11+3=14。'],['首項 4，公差 2，第 5 項是？',['12','10','14','8'],0,'第 5 項 = 首項 + 4 個公差。','4+(5−1)×2=12。'],['10、7、4、1，公差是？',['−3','3','−4','1'],0,'第二項減第一項。','7−10=−3。'],['首項 3，公差 4，第 10 項是？',['39','40','43','36'],0,'套入 aₙ = a₁ + (n−1)d。','3+9×4=39。']]}
];
const $=id=>document.getElementById(id);const key='mathSlowlyV1';let store;try{store=JSON.parse(localStorage.getItem(key))||{attempts:0,correct:0,mistakes:{}}}catch{store={attempts:0,correct:0,mistakes:{}}}if(!store.mistakes)store.mistakes={};let unit=0,index=0,answered=false,level='basic',hintCount=0,reviewMode=false;
function save(){try{localStorage.setItem(key,JSON.stringify(store))}catch{}}function stats(){$('attempts').textContent=store.attempts;$('correct').textContent=store.correct;$('accuracy').textContent=store.attempts?Math.round(100*store.correct/store.attempts)+'%':'0%'}
function tab(name){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));['learn','practice','mistakes'].forEach(id=>$(id).classList.toggle('hidden',id!==name));if(name==='mistakes')renderMistakes()}
function renderUnits(){$('units').replaceChildren();data.forEach((u,i)=>{let b=document.createElement('button');b.className='unit'+(unit===i?' active':'');b.textContent=(i+1)+'. '+u.name;b.onclick=()=>{unit=i;index=0;reviewMode=false;renderUnits();renderLesson();tab('learn')};$('units').append(b)})}
function renderLesson(){let u=data[unit];$('lessonTitle').textContent=u.name;$('lessonBody').innerHTML=u.lesson;$('unitLabel').textContent=u.name}
function questionKey(u,i){return u.id+'-'+i}function getQ(){return data[unit].q[index]}
function renderQuestion(){answered=false;hintCount=0;let q=getQ();$('question').textContent=q[0];$('answers').replaceChildren();q[1].forEach((a,i)=>{let b=document.createElement('button');b.className='answer';b.textContent=String.fromCharCode(65+i)+'. '+a;b.onclick=()=>answer(i);$('answers').append(b)});$('feedback').classList.add('hidden');$('next').textContent='下一題 →';$('unitLabel').textContent=data[unit].name+(reviewMode?' · 錯題複習':' · '+(level==='basic'?'基礎':'進階'))}
function showMessage(msg){$('feedback').textContent=msg;$('feedback').classList.remove('hidden')}
function answer(choice){if(answered)return;answered=true;let q=getQ(),ok=choice===q[2],buttons=[...$('answers').children];buttons[choice].classList.add(ok?'correct':'wrong');buttons[q[2]].classList.add('correct');buttons.forEach(b=>b.disabled=true);store.attempts++;if(ok){store.correct++;delete store.mistakes[questionKey(data[unit],index)]}else{store.mistakes[questionKey(data[unit],index)]=true}save();stats();showMessage((ok?'答對了！🎉 ':'這題再練一下。')+q[5])}
function next(){if(reviewMode){let keys=Object.keys(store.mistakes);if(!keys.length){reviewMode=false;tab('mistakes');return}let current=questionKey(data[unit],index),pos=keys.indexOf(current),key=keys[(Math.max(pos,0)+1)%keys.length];if(keys.length===1)key=keys[0];goKey(key)}else{let candidates=level==='basic'?[0,1]:[2,3];let pos=candidates.indexOf(index);index=candidates[(pos+1)%candidates.length];renderQuestion()}}
function goKey(key){let match=/^(.*)-(\d+)$/.exec(key);if(!match)return;let u=data.findIndex(d=>d.id===match[1]);let i=Number(match[2]);if(u<0||!data[u].q[i])return;unit=u;index=i;renderUnits();renderLesson();renderQuestion();tab('practice')}
function renderMistakes(){let keys=Object.keys(store.mistakes).filter(k=>{let m=/^(.*)-(\d+)$/.exec(k);return m&&data.some(d=>d.id===m[1]&&d.q[Number(m[2])])});$('mistakeList').replaceChildren();if(!keys.length){let p=document.createElement('p');p.className='empty';p.textContent='目前沒有錯題。答錯的題目會自動出現在這裡。';$('mistakeList').append(p)}keys.forEach(k=>{let m=/^(.*)-(\d+)$/.exec(k),u=data.find(d=>d.id===m[1]),q=u.q[Number(m[2])],b=document.createElement('button');b.className='unit';b.style.display='block';b.style.width='100%';b.style.marginBottom='9px';b.textContent=u.name+'｜'+q[0];b.onclick=()=>{reviewMode=true;goKey(k)};$('mistakeList').append(b)});$('clearMistakes').disabled=!keys.length}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('startPractice').onclick=()=>{reviewMode=false;index=level==='basic'?0:2;renderQuestion();tab('practice')};$('level').onchange=e=>{level=e.target.value;reviewMode=false;index=level==='basic'?0:2;renderQuestion()};$('hint').onclick=()=>{let q=getQ();hintCount++;showMessage(hintCount===1?'提示：'+q[3]:'提示：'+q[3]+'\n如果還是不懂，可以點「看詳解」。')};$('explain').onclick=()=>showMessage('詳解：'+getQ()[5]);$('next').onclick=next;$('clearMistakes').onclick=()=>{if(confirm('確定要清空錯題本嗎？')){store.mistakes={};save();renderMistakes()}};renderUnits();renderLesson();stats();
</script></body></html>
