<script>
const units=[{"subject":"國文","edition":"翰林","term":"上學期","title":"詞語、成語與語意辨析","intro":"從語境判斷詞語真正的意思，不只背字面。","facts":[["語境判讀","依上下文判斷詞義","「他沉默片刻才回答」要看前後情節判斷心情","每個詞在任何文章都只有一種固定意思"],["近義詞辨析","比較相似詞語在程度與語氣上的差別","選用「凝視」而非「看」，凸顯專注程度","意思相近的詞在所有句子都能直接互換"],["成語運用","同時考量成語的含義與使用對象","稱讚勤學者「孜孜不倦」","只要成語字面好聽就可以套進句子"],["轉折關係","留意「雖然、但是」等語詞形成的對比","「雖然下雨，仍照常出發」強調出發","看到「但是」就忽略它後面的資訊"],["因果關係","辨別原因、結果與推論是否合理","「因準備充分，所以表現穩定」","時間先後發生就一定代表因果關係"]]},{"subject":"國文","edition":"翰林","term":"上學期","title":"記敘文與描寫技巧","intro":"學習判斷人物、事件、時間順序和描寫效果。","facts":[["順敘","按事件發生時間先後敘述","從出門、到站、回家依序交代經過","順敘必須先寫結局再回到開頭"],["倒敘","先交代較後的事件，再回述先前經過","開頭先寫得獎，再回想準備歷程","倒敘只是把句子順序任意打亂"],["伏筆","前文先安排線索，後文加以呼應","前文提到鑰匙不見，結尾揭露重要原因","伏筆必須立即在同一句揭曉"],["動作描寫","透過人物動作呈現情緒或性格","「他攥緊紙條、加快腳步」透露緊張","動作描寫只能用來描述外貌"],["感官描寫","使用視、聽、嗅、味、觸覺增添畫面","「雨滴敲著屋簷」呈現聽覺","感官描寫只能使用視覺"]]},{"subject":"國文","edition":"翰林","term":"下學期","title":"文言文閱讀與句意","intro":"掌握古今詞義、句式及語氣，提升文言理解。","facts":[["古今異義","同一詞語在古文與現代語言可能含義不同","讀到古文的「走」先檢查是否表示奔跑","文言文詞義一定和現代口語相同"],["省略句","從上下文補出省略的主語或賓語","前文出現人物後，下句省略其名字","省略句完全不需要上下文就能理解"],["倒裝句","認識文言語序可能不同於現代口語","先理清主詞、動詞、受詞再翻譯","翻譯文言一定要逐字照原語序排列"],["語氣詞","透過句末字詞判斷疑問、感嘆或陳述","句末出現「乎」時注意疑問語氣","句末語氣詞不會影響句子意思"],["譬喻","以熟悉事物說明另一事物的特點","把時間比作流水以凸顯流逝","譬喻只要出現兩個名詞就成立"]]},{"subject":"國文","edition":"翰林","term":"下學期","title":"論說文與閱讀推論","intro":"判斷文章觀點、理由、證據及推論是否站得住腳。","facts":[["中心論點","作者最主要想說服讀者接受的主張","一篇文章反覆呼籲珍惜資源","中心論點就是字數最多的一句話"],["論據","支持觀點的例子、統計或事實","引用具來源的調查結果支持主張","只要作者語氣堅定就不需要證據"],["對比論證","比較兩種情況，突顯差異","比較有準備與沒準備的學習結果","對比論證只是在文章中列出兩個無關事物"],["事實與意見","分清可查證陳述和個人判斷","「圖書館九點開門」可查證，「最好」屬評價","所有使用數字的句子都必然正確"],["合理推論","根據文中線索推得未明說的結果","角色反覆查時刻表，可推測他在意行程","推論可以完全不依文章內容"]]},{"subject":"英文","edition":"康軒","term":"上學期","title":"過去式與時間表達","intro":"描述已經發生的事情，區分規則與不規則動詞。","facts":[["simple past","表達過去已完成的動作","Yesterday, Amy visited her grandparents.","有 yesterday 的句子必須用現在進行式"],["irregular verbs","部分動詞過去式需另記字形","go 的過去式是 went","所有過去式一律加 -ed"],["did questions","一般動詞過去式疑問句使用 did 加原形","Did you finish your homework?","Did 後面還要使用 went 這類過去式"],["be past","was、were 是 be 動詞的過去式","They were tired last night.","主詞 they 後面過去式一定是 was"],["time sequence","用 first、then、finally 安排事件順序","First we ate; then we walked home.","then 用來表示和前一件事完全無關"]]},{"subject":"英文","edition":"康軒","term":"上學期","title":"不定詞、動名詞與助動詞","intro":"分辨動詞後的結構，表達目的、能力和義務。","facts":[["to-infinitive","to 後接原形動詞可表目的或特定動詞補語","I want to learn English.","want 後面一定接 learning"],["gerund","動詞加 -ing 可以當名詞使用","Swimming is good exercise.","動名詞只能當現在進行式"],["modal can","can 後面接原形動詞表能力或許可","She can solve the problem.","can 後面必須加 to"],["modal must","must 後接原形動詞表義務或強烈必要","You must wear a helmet.","must 後面一定用過去式"],["because and so","用 because 指原因、so 指結果","It rained, so we stayed home.","because 與 so 在同一句一定要一起使用"]]},{"subject":"英文","edition":"康軒","term":"下學期","title":"比較級、最高級與程度","intro":"比較人事物差異，注意不規則變化和比較範圍。","facts":[["comparative","比較兩者常用 -er 或 more","This bag is heavier than that one.","比較級一定搭配 the most"],["superlative","三者以上比較常用 the -est 或 the most","This is the tallest building here.","最高級通常只比較兩個事物"],["irregular comparison","good→better→best 等需另記","Her second try was better than her first.","good 的比較級是 gooder"],["as ... as","表達兩者在某方面程度相同","This box is as heavy as that box.","as ... as 中間一定放比較級"],["too ... to","表示太……而不能……","The box is too heavy to lift.","too ... to 表示很容易就能做到"]]},{"subject":"英文","edition":"康軒","term":"下學期","title":"連接詞、子句與閱讀","intro":"連接事件及因果，從短文推論時間與人物意圖。","facts":[["when clause","when 引導事件發生的時間","I was reading when the phone rang.","when 只能表示地點"],["while clause","while 常用於兩件同時進行的事情","While I was studying, Mom was cooking.","while 一律只能接未來式"],["if condition","if 可引導條件關係","If it rains, we will stay indoors.","if 條件句必然表示已經發生的事"],["although contrast","although 引導讓步、轉折語意","Although it was cold, we went outside.","although 表示兩件事必然互為因果"],["context clues","藉上下文推測生字含義","句子說 he was exhausted and fell asleep，可推測疲累","閱讀遇到生字一定要整篇停止才能理解"]]},{"subject":"自然（理化）","edition":"康軒","term":"上學期","title":"測量、密度與物質","intro":"從數據和實驗辨別物質性質。","facts":[["密度","單位體積所含的質量，密度=質量÷體積","同材質兩塊金屬大小不同，密度可相同","物質質量加倍時密度必然加倍"],["控制變因","實驗時只改變主要操縱變因","測溫度對溶解速度影響時保持水量相同","一次改變很多因素最容易確認因果"],["體積測量","不規則固體可用排水法估測體積","石頭放進量筒前後水位差為其體積","排水法讀取的是石頭質量"],["物理變化","物質形態改變但未生成新物質","冰融成水","冰融化必然產生新的化學物質"],["溶解度","在一定溫度下溶質可溶解的最大量","水溫不同可能使固體溶解度改變","任何溶質的溶解度都與溫度無關"]]},{"subject":"自然（理化）","edition":"康軒","term":"上學期","title":"波動、聲音與光","intro":"用波和光的性質解釋身邊現象。","facts":[["頻率","每秒振動次數，單位赫茲","聲音音調較高通常與頻率較高有關","聲音越大聲就一定表示頻率越高"],["振幅","振動偏離平衡位置的最大距離","敲鼓力道較大通常使振幅增大","振幅只決定聲音的傳播速度"],["反射定律","入射角等於反射角","鏡子能形成反射影像","反射角永遠比入射角大"],["折射","光進入不同介質可能改變行進方向","水中的吸管看起來彎折","折射是光被物體完全吸收"],["透鏡","凸透鏡可會聚平行光","放大鏡使用凸透鏡","凸透鏡一定會使所有物體成縮小像"]]},{"subject":"自然（理化）","edition":"康軒","term":"下學期","title":"熱、溫度與能量","intro":"認識熱能移轉與不同材料的受熱差異。","facts":[["熱傳導","熱沿物體內部由高溫處往低溫處移轉","金屬湯匙一端受熱另一端逐漸變燙","熱傳導需要物質整體大幅流動"],["熱對流","流體因溫度和密度差產生循環流動","熱水上升、冷水下降形成循環","固態鐵塊內主要依對流傳熱"],["熱輻射","熱以電磁波形式傳遞，不需介質","太陽使地表變暖","熱輻射一定需要空氣才能發生"],["比熱","單位質量物質升高一度所需的熱量","同質量水與金屬受相同熱量時升溫可能不同","所有物質的比熱完全相同"],["熱平衡","相接觸物體最後可能趨向相同溫度","熱水與冷水混合後達到共同溫度","熱量只會從低溫物體流向高溫物體"]]},{"subject":"自然（理化）","edition":"康軒","term":"下學期","title":"原子、化學反應與守恆","intro":"從粒子和證據理解反應，不把質量消失誤認成變化。","facts":[["元素","由相同質子數的原子構成的物質種類","氧元素與鐵元素原子種類不同","任何含氧物質都屬於氧元素單質"],["化合物","不同元素依固定組成形成純物質","水由氫和氧元素組成","化合物一定能用過濾法分離"],["質量守恆","封閉系統中的化學反應總質量守恆","密閉容器內反應前後總質量相同","化學反應會使原子憑空消失"],["化學式","使用元素符號與下標表示組成","H₂O 表示一個水分子含兩個氫原子","H₂O 表示水由兩個氧原子組成"],["化學變化","反應中形成新的物質","鐵生鏽產生不同於鐵的新物質","物體被剪成小塊就是化學反應"]]},{"subject":"地理","edition":"翰林","term":"上學期","title":"中國自然環境與地形","intro":"理解地形、氣候和人口分布的關係。","facts":[["西高東低","中國地勢大致西高東低呈階梯狀","許多大河由西往東流入海洋","中國整體地勢東高西低"],["季風影響","季風帶來季節性風向與降水變化","中國東部夏季受海洋暖濕氣流影響","季風代表全年風向永遠不變"],["人口分布","自然與經濟條件共同影響人口密度","交通便利且平原較多的東部人口通常較密集","人口分布只由國土面積決定"],["河流中下游","河川中下游常形成平原與人口聚集區","長江下游平原利於農業與聚落","河流中下游都只有高山地形"],["高原氣候","海拔升高通常使氣溫下降","青藏高原即使緯度較低也可能寒冷","海拔越高必然越熱"]]},{"subject":"地理","edition":"翰林","term":"上學期","title":"中國產業與區域發展","intro":"比較區域資源、交通與產業發展差異。","facts":[["第一級產業","農林漁牧提供原料","稻米種植屬農業生產","晶片設計屬第一級產業"],["第二級產業","加工原料製造產品", function makeQuestions(ch){
 const u=units[ch], rows=u.facts, all=[];
 const label=u.subject==="國文"?"文本閱讀":u.subject==="自然（理化）"?"實驗與情境判讀":u.subject==="歷史"?"史料分析":u.subject==="地理"?"區域與資料判讀":"公民素養";
 for(let i=0;i<5;i++){
  const f=rows[i],other=[rows[(i+1)%5],rows[(i+2)%5],rows[(i+3)%5]],pair=other[0];
  const first="資料甲："+f[2]+"。\n資料乙："+pair[2]+"。";
  all.push({type:label,text:"根據資料甲，最能說明其核心概念的是哪一項？",passage:first,answer:f[0],wrong:other.map(x=>x[0]),hint:"把資料甲的事件和本章五個重點一一對照。",why:"資料甲呈現「"+f[0]+"」："+f[1]+"。資料乙則主要對應「"+pair[0]+"」。"});
  all.push({type:"閱讀理解",text:"某位同學提出了以下主張。若要依課堂所學修正他的看法，哪一項最恰當？",passage:"情境："+f[2]+"。\n同學的主張："+f[3],answer:f[1],wrong:other.map(x=>x[1]),hint:"主張往往使用過度絕對的說法；找出直接針對此情境的觀念。",why:"原主張「"+f[3]+"」有誤。應理解："+f[1]+"。"});
  const answer="甲："+f[0]+"；乙："+pair[0];
  all.push({type:"跨觀念素養題",text:"比較上述兩段材料，哪一組概念對應最正確？",passage:first,answer,wrong:["甲："+pair[0]+"；乙："+f[0],"甲："+f[0]+"；乙："+other[1][0],"甲："+other[1][0]+"；乙："+pair[0]],hint:"先分別判斷資料甲與資料乙，再檢查選項順序。",why:"資料甲重點是「"+f[0]+"」，資料乙是「"+pair[0]+"」，兩者不可倒置。"});
  all.push({type:"證據判讀",text:"若要指出下列說法的問題，哪一則材料最能直接作為反例或修正線索？",passage:"待檢驗說法：「"+f[3]+"」",answer:f[2],wrong:other.map(x=>x[2]),hint:"找出和待檢驗說法同一主題、但能呈現正確情況的例子。",why:"「"+f[2]+"」說明「"+f[0]+"」的正確運作，應以此修正錯誤說法。"});
 }
 return all;
}
const englishExams=[[{"type":"文法選擇","text":"Kevin _____ his phone on the bus yesterday.","answer":"lost","wrong":["loses","lose","losing"],"why":"yesterday 是過去，lose 過去式 lost。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"My parents _____ home last night because they went to a concert.","answer":"weren't","wrong":["aren't","wasn't","don't"],"why":"parents 複數過去式 be 為 were，否定 weren't。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"_____ Judy finish her project before dinner yesterday?","answer":"Did","wrong":["Does","Was","Is"],"why":"過去式一般動詞問句使用 Did 加原形。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"The children _____ in the park when it began to rain.","answer":"were playing","wrong":["played","are playing","plays"],"why":"過去某事件發生時正在進行的動作用過去進行式。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"I didn't _____ the answer, so I asked for help.","answer":"know","wrong":["knew","knows","knowing"],"why":"didn't 後接原形。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"Mr. Lin _____ us a story and then asked questions.","answer":"told","wrong":["tell","tells","telling"],"why":"tell 過去式 told；asked 也是過去式。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"Mia was tired, but she _____ her homework before bed.","answer":"finished","wrong":["finish","finishes","finishing"],"why":"描述過去已完成動作用過去式。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"Which sentence is correct?","answer":"Did you see the movie last Sunday?","wrong":["Did you saw the movie last Sunday?","Were you see the movie last Sunday?","Do you saw the movie last Sunday?"],"why":"Did 後接原形 see。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"When I got home, my brother _____ dinner.","answer":"was cooking","wrong":["is cooking","cooks","cook"],"why":"過去當時正在煮飯，使用 was cooking。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"They _____ to the museum last Saturday, but it was closed.","answer":"went","wrong":["go","goes","going"],"why":"go 的過去式 went。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"對話填空","text":"A: Where were you at eight last night?\nB: _____","answer":"I was studying in my room.","wrong":["I study tomorrow.","I will study yesterday.","I am study last night."],"why":"問過去時間的活動，選 was studying。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"對話填空","text":"A: Did you enjoy the school trip?\nB: _____ The weather was great.","answer":"Yes, I did.","wrong":["Yes, I do.","No, I didn't.","Yes, I was."],"why":"Did 問句用 did 回答；後面是正面評價。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"對話填空","text":"A: Why didn't Leo come to school yesterday?\nB: _____","answer":"He was sick.","wrong":["He is coming tomorrow.","He goes by bus.","He likes his school."],"why":"why 問原因，was sick 合理。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"對話填空","text":"A: What happened to your bike?\nB: _____","answer":"I fell off it this morning.","wrong":["I ride it every day.","It will be blue.","I am riding tomorrow."],"why":"What happened 問已發生的事，用過去式。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"克漏字","text":"Choose the best word for (1).","answer":"arrived","wrong":["arrives","arriving","arrive"],"why":"Last Friday 表示過去，arrived。","passage":"Last Friday, Nina (1) _____ at the station early. She (2) _____ her ticket. In the end, she (3) _____ the train.","hint":"觀察空格前後的時態與句型。"},{"type":"克漏字","text":"Choose the best word for (2).","answer":"lost","wrong":["lose","loses","losing"],"why":"過去式 lose→lost。","passage":"Last Friday, Nina (1) _____ at the station early. She (2) _____ her ticket. In the end, she (3) _____ the train.","hint":"觀察空格前後的時態與句型。"},{"type":"克漏字","text":"Choose the best word for (3).","answer":"caught","wrong":["catch","catches","catching"],"why":"catch 過去式為 caught。","passage":"Last Friday, Nina (1) _____ at the station early. She (2) _____ her ticket. In the end, she (3) _____ the train.","hint":"觀察空格前後的時態與句型。"},{"type":"閱讀理解","text":"Why did Owen stay home?","answer":"He had a fever.","wrong":["He missed the bus.","He forgot his homework.","He wanted to play outside."],"why":"文章第一句說 Owen had a fever。","passage":"Owen had a fever on Sunday, so he stayed home. His classmates visited a science museum. On Monday, they showed him photos and told him about the experiments.","hint":"先找短文的關鍵句與證據。"},{"type":"閱讀理解","text":"Where did his classmates go?","answer":"A science museum.","wrong":["Owen's home.","A hospital.","A library."],"why":"文章明說 visited a science museum。","passage":"Owen had a fever on Sunday, so he stayed home. His classmates visited a science museum. On Monday, they showed him photos and told him about the experiments.","hint":"先找短文的關鍵句與證據。"},{"type":"閱讀理解","text":"Which statement is TRUE?","answer":"Owen learned about the trip from his classmates.","wrong":["Owen joined the trip.","The trip was on Monday.","Owen performed the experiments."],"why":"同學在週一分享照片與實驗。","passage":"Owen had a fever on Sunday, so he stayed home. His classmates visited a science museum. On Monday, they showed him photos and told him about the experiments.","hint":"先找短文的關鍵句與證據。"}],[{"type":"文法選擇","text":"Lily decided _____ the school team.","answer":"to join","wrong":["joining","join","joined"],"why":"decide to + 原形。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"My brother enjoys _____ to English songs.","answer":"listening","wrong":["listen","to listen","listened"],"why":"enjoy + V-ing。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"We must _____ our homework before class.","answer":"finish","wrong":["to finish","finishing","finished"],"why":"must + 原形。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"It is important _____ enough sleep.","answer":"to get","wrong":["getting","get","got"],"why":"It is important to V。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"_____ your phone during the test.","answer":"Don't use","wrong":["Not use","Doesn't use","To not ) _____ upstairs.","hint":"觀察空格前後的時態與句型。"},{"type":"克漏字","text":"Choose the best answer for (3).","answer":"to carry","wrong":["carrying","carry","to carrying"],"why":"easier to V。","passage":"Tina compared two bikes. The first was (1) _____ than the second but also (2) _____ heavier. She chose the second because it was easier (3) _____ upstairs.","hint":"觀察空格前後的時態與句型。"},{"type":"閱讀理解","text":"Which route takes the least time?","answer":"Route C","wrong":["Route A","Route B","All take the same time."],"why":"Route C 18 分鐘最短。","passage":"Three routes lead to the library. Route A takes 25 minutes and has no stairs. Route B takes 22 minutes but has many stairs. Route C takes 18 minutes but is often crowded. Ken has a heavy suitcase and wants to avoid stairs.","hint":"先找短文的關鍵句與證據。"},{"type":"閱讀理解","text":"Which route is best for Ken?","answer":"Route A","wrong":["Route B","Route C","No route is possible."],"why":"只有 A 明確沒有樓梯。","passage":"Three routes lead to the library. Route A takes 25 minutes and has no stairs. Route B takes 22 minutes but has many stairs. Route C takes 18 minutes but is often crowded. Ken has a heavy suitcase and wants to avoid stairs.","hint":"先找短文的關鍵句與證據。"},{"type":"閱讀理解","text":"Which statement is supported?","answer":"Route B is faster than Route A.","wrong":["Route A is the fastest.","Route C has no stairs.","Route B is never crowded."],"why":"22 分鐘比 25 分鐘快。","passage":"Three routes lead to the library. Route A takes 25 minutes and has no stairs. Route B takes 22 minutes but has many stairs. Route C takes 18 minutes but is often crowded. Ken has a heavy suitcase and wants to avoid stairs.","hint":"先找短文的關鍵句與證據。"}],[{"type":"文法選擇","text":"_____ it was raining, they played basketball.","answer":"Although","wrong":["Because","So","If"],"why":"下句與下雨呈轉折：Although。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"If it _____ tomorrow, we will stay indoors.","answer":"rains","wrong":["will rain","rained","raining"],"why":"真實未來條件句 if 子句用現在簡單式。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"My dad called me _____ I was doing homework.","answer":"while","wrong":["unless","because of","so"],"why":"while 接持續進行的背景事件。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"I was brushing my teeth when someone _____ at the door.","answer":"knocked","wrong":["knocks","knock","was knock"],"why":"過去某刻發生的短暫動作用 knocked。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"_____ you read carefully, you may miss details.","answer":"Unless","wrong":["Although","When","Because"],"why":"unless = 除非。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"We stayed inside _____ the strong wind.","answer":"because of","wrong":["because","although","so"],"why":"後接名詞片語用 because of。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"When the teacher entered, everyone _____ quietly.","answer":"was reading","wrong":["reads","read tomorrow","are read"],"why":"當時正在閱讀用過去進行式。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"Which sentence is correct?","answer":"If she has time, she will join us.","wrong":["If she will have time, she will join us.","If she have time, she joins us tomorrow.","If she having time, she will joins us."],"why":"if 子句現在式 has，主句 will。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"You can borrow it _____ you return it next week.","answer":"if","wrong":["although","unless","while"],"why":"if 引導條件。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"文法選擇","text":"_____ Sam felt nervous, he gave a clear speech.","answer":"Although","wrong":["Because of","If only","So"],"why":"雖緊張但表現清楚是轉折。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"對話填空","text":"A: Can we hike if it rains?\nB: _____","answer":"No, we'll stay home if the weather is bad.","wrong":["Yes, we stay home yesterday.","No, we will hiking if rain.","If it will rain, we go."],"why":"if 子句用現在式。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"對話填空","text":"A: Why were you late?\nB: _____","answer":"Because the bus broke down.","wrong":["Although the bus broke down.","If the bus breaks down.","While I go to school."],"why":"because 表原因。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"對話填空","text":"A: What were you doing when the lights went out?\nB: _____","answer":"I was reading a book.","wrong":["I read a book tomorrow.","I am read a book yesterday.","I will reading."],"why":"過去進行式回答當時正在做的事。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"對話填空","text":"A: Why did Mia bring a jacket?\nB: _____","answer":"Although it was warm, the weather might change.","wrong":["Because of it was warm, so she brought.","If the weather will change.","While the jacket is warm yesterday."],"why":"although 表轉折且語意合適。","passage":"","hint":"注意時間、文法結構與上下文語意。"},{"type":"克漏字","text":"Choose the best word for (1).","answer":"When","wrong":["Because of","Unless","So"],"why":"when 引導時間子句。","passage":"(1) _____ the rain started, Eric was waiting for the bus. He had no umbrella, (2) _____ he moved under a roof. He waited until the rain (3) _____.","hint":"觀察空格前後的時態與句型。"},{"type":"克漏字","text":"Choose the best word for (2).","answer":"so","wrong":["although","if","unless"],"why":"so 引出結果。","passage":"(1) _____ the rain started, Eric was waiting for the bus. He had no umbrella, (2) _____ he moved under a roof. He waited until the rain (3) _____.","hint":"觀察空格前後的時態與句型。"},{"type":"克漏字","text":"Choose the best word for (3).","answer":"stopped","wrong":["stop","stops","stopping"],"why":"全文描述過去，stop 過去式 stopped。","passage":"(1) _____ the rain started, Eric was waiting for the bus. He had no umbrella, (2) _____ he moved under a roof. He waited until the rain (3) _____.","hint":"觀察空格前後的時態與句型。"},{"type":"閱讀理解","text":"Why was the festival moved indoors?","answer":"Heavy rain was expected.","wrong":["Students wanted homework.","There were no classrooms.","Performers were absent."],"why":"公告說 heavy rain is expected。","passage":"School Notice: The music festival will take place in the gym instead of the playground because heavy rain is expected. The starting time remains 2 p.m. Helpers should arrive by 1:30 p.m. If the weather improves, the event will still be held in the gym.","hint":"先找短文的關鍵句與證據。"},{"type":"閱讀理解","text":"When should helpers arrive?","answer":"By 1:30 p.m.","wrong":["At 2:30 p.m.","At 3 p.m.","After 2 p.m."],"why":"helpers should arrive by 1:30 p.m.。","passage":"School Notice: The music festival will take place in the gym instead of the playground because heavy rain is expected. The starting time remains 2 p.m. Helpers should arrive by 1:30 p.m. If the weather improves, the event will still be held in the gym.","hint":"先找短文的關鍵句與證據。"},{"type":"閱讀理解","text":"What happens if the weather improves?","answer":"The festival will still be in the gym.","wrong":["It moves outdoors.","It is canceled.","It starts at 1:30 p.m."],"why":"公告最後一句說仍在體育館。","passage":"School Notice: The music festival will take place in the gym instead of the playground because heavy rain is expected. The starting time remains 2 p.m. Helpers should arrive by 1:30 p.m. If the weather improves, the event will still be held in the gym.","hint":"先找短文的關鍵句與證據。"}]];
const englishUnitIds=units.map((u,i)=>u.subject==='英文'?i:-1).filter(i=>i>=0);
const banks=units.map((u,i)=>u.subject==='英文'?englishExams[englishUnitIds.indexOf(i)]:makeQuestions(i));
function options(ch,n){let q=banks[ch][n],a=[q.answer,...q.wrong];let seed=(ch+13)*331+n*17;for(let j=3;j>0;j--){seed=(Math.imul(seed,1664525)+1013904223)>>>0;let k=seed%(j+1);[a[j],a[k]]=[a[k],a[j]]}return a}
function counts(ch){let done=0,good=0;for(let i=0;i<20;i++){let x=state.done[key(ch,i)];if(x){done++;if(x==="correct")good++}}return [done,good]}
function subjectOf(ch){return units[ch].subject==="自然（理化）"?"自然（理化）":units[ch].subject}
function nav(){ $("subjects").innerHTML=SUBJECTS.map(s=>'<button class="navbtn '+(active===s?"active":"")+'" data-sub="'+esc(s)+'">'+emojis[s]+" "+esc(s)+'</button>').join("");document.querySelectorAll("[data-sub]").forEach(b=>b.onclick=()=>openSubject(b.dataset.sub));if(active==="首頁"||active==="數學"){$("chapters").innerHTML="";return}let idxs=units.map((u,i)=>[u,i]).filter(([u])=>subjectOf(units.indexOf(u))===active);let last="";$("chapters").innerHTML=idxs.map(([u,i])=>{let h="";if(last!==u.term){last=u.term;h='<div class="term">'+esc(last)+'</div>'}return h+'<button class="unitbtn '+(i===chapter?"active":"")+'" data-ch="'+i+'">'+esc(u.title)+'<small>'+counts(i)[0]+'/20 題已練習</small></button>'}).join("");document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{chapter=Number(b.dataset.ch);question=0;selection=null;checked=false;review=false;notice="";render()})}
function openSubject(s){active=s;review=false;chapter=-1;question=0;selection=null;checked=false;notice="";render()}
function render(){nav();if(active==="首頁"){home();return}if(active==="數學"){math();return}if(review){renderMistakes();return}if(chapter<0){listing();return}lesson()}
function home(){let card=s=>'<div class="card"><b>'+emojis[s]+' '+s+'</b><p class="muted">'+(s==="數學"?"保留完整九章、180 題舊版數學練習":'上、下學期共 '+units.filter(u=>u.subject===s).length+' 個主題單元；每單元 20 題')+'</p><button class="btn alt" data-home="'+s+'">進入 '+s+'</button></div>';$("view").innerHTML='<h2>歡迎來到國二全年學習室</h2><p class="muted">選一科 → 選一個主題 → 先看單元大綱與概念範例，再完成 20 題中等到中高難度練習。</p><div class="pill">7 科 · 24 個新增主題 · 480 題新增練習 · 原數學 180 題</div>'+SUBJECTS.map(card).join("");document.querySelectorAll("[data-home]").forEach(b=>b.onclick=()=>openSubject(b.dataset.home))}
function math(){$("view").innerHTML='<h2>📐 數學｜翰林版學習方向</h2><p class="muted">原本的數學網站已完整保留：9 章、180 題，以及原有的單元大綱、範例、提示和錯題本。</p><div class="lesson">為避免更動你原有的學習進度，數學教材保留在獨立頁面。</div><div class="row"><a href="math.html" class="btn" style="text-decoration:none">開啟原數學學習室 →</a></div>'}
function listing(){let ix=units.map((u,i)=>[u,i]).filter(([u])=>u.subject===active);$("view").innerHTML='<h2>'+emojis[active]+' '+active+'｜'+(ix[0]?.[0].edition||"")+'版學習方向</h2><p class="muted">以下是為國二自學整理的全年主題，不等同於出版社教科書逐課目錄。選擇章節即可看大綱及開始作答。</p>'+ix.map(([u,i])=>'<div class="card"><span class="pill">'+u.term+'</span><h3>'+esc(u.title)+'</h3><p>'+esc(u.intro)+'</p><small>'+counts(i)[0]+'/20 題已作答</small><div class="row"><button class="btn" data-ch="'+i+'">進入本單元 →</button></div></div>').join("");document.querySelectorAll("[data-ch]").forEach(b=>b.onclick=()=>{chapter=Number(b.dataset.ch);question=0;selection=null;checked=false;render()})}
function lesson(){let u=units[chapter],q=banks[chapter][question],opts=options(chapter,question),c=counts(chapter),stage=question<8?"中等":question<15?"中高":"挑戰";$("view").innerHTML='<span class="pill">'+u.term+' · '+u.edition+'版學習方向</span><h2>'+esc(u.title)+'</h2><div class="lesson"><b>🧭 單元大綱｜這章在學什麼？</b><p>'+esc(u.intro)+'</p><b>🎯 學習目標</b><ol>'+u.facts.map(f=>'<li><b>'+esc(f[0])+'</b>：'+esc(f[1])+'</li>').join("")+'</ol></div><div class="card"><b>✏️ 觀念與生活範例</b><p>'+esc(u.facts[question%5][2])+'</p><p><b>想一想：</b>這個例子和哪一個重點有關？</p></div><div class="cards"><div class="stat">本章題數<b>20</b></div><div class="stat">已作答<b>'+c[0]+'</b></div><div class="stat">答對<b>'+c[1]+'</b></div></div><div class="progress"><div style="width:'+(5*c[0])+'%"></div></div><hr style="border:0;border-top:1px solid #e4edf3;margin:19px 0"><span class="pill">'+stage+'｜第 '+(question+1)+'/20 題</span><div class="q">'+(q.type?'<span class="pill">'+esc(q.type)+'</span>':"")+'</div>'+(q.passage?'<div class="card" style="white-space:pre-wrap"><b>閱讀題組</b><p>'+esc(q.passage)+'</p></div>':'')+'<div class="q" style="white-space:pre-wrap">'+esc(q.text)+'</div><div class="choices">'+opts.map((a,i)=>'<button class="choice '+(selection===a?"selected ":"")+(checked?(a===q.answer?"correct":a===selection?"wrong":""):"")+'" data-option="'+i+'" '+(checked?"disabled":"")+'>'+String.fromCharCode(65+i)+'. '+esc(a)+'</button>').join("")+'</div><div class="row"><button class="btn" id="submit" '+(selection===null||checked?"disabled":"")+'>確認答案</button><button class="btn alt" id="hint">給我提示</button><button class="btn alt" id="explain">查看詳解</button></div><div id="feedback" aria-live="polite"></div><div class="row"><button class="btn alt" id="prev" '+(question===0?"disabled":"")+'>← 上一題</button><button class="btn" id="next">'+(question===19?"下一單元 →":"下一題 →")+'</button></div>';
document.querySelectorAll("[data-option]").forEach(b=>b.onclick=()=>{selection=opts[Number(b.dataset.option)];render()});
$("submit").onclick=()=>{if(selection===null||checked)return;checked=true;let correct=selection===q.answer,k=key(chapter,question);state.done[k]=correct?"correct":"wrong";if(correct)delete state.mistakes[k];else state.mistakes[k]=true;persist();notice=(correct?"✅ 答對！":"❗ 正確答案："+q.answer+"。")+" "+q.why;render()};
$("hint").onclick=()=>{let e=$("feedback");e.className="feedback";e.textContent="💡 提示："+q.hint};
$("explain").onclick=()=>{let e=$("feedback");e.className="feedback";e.textContent="📖 詳解："+q.why+" 正解："+q.answer};
$("prev").onclick=()=>{if(question>0){question--;selection=null;checked=false;notice="";render()}};
$("next").onclick=()=>{if(question===19){let next=units.findIndex((x,i)=>i>chapter&&x.subject===active);if(next<0)next=units.findIndex(x=>x.subject===active);chapter=next;question=0}else question++;selection=null;checked=false;notice="";render()};
if(checked){let e=$("feedback");e.className="feedback "+(selection===q.answer?"":"bad");e.textContent=notice}}
function renderMistakes(){const ids=Object.keys(state.mistakes).filter(k=>state.mistakes[k]).filter(k=>{let i=Number(k.split("-")[0]);return units[i]?.subject===active});$("view").innerHTML='<h2>📝 '+active+'錯題本</h2><p class="muted">答錯的題目會留下來，重新答對後自動移除。</p>'+(ids.length?ids.map(k=>{let [i,j]=k.split("-").map(Number);return '<button class="unitbtn" data-retry="'+k+'">'+esc(units[i].title)+'｜第 '+(j+1)+' 題：'+esc(banks[i][j].text)+'</button>'}).join(""):'<div class="lesson">目前沒有需要複習的錯題。</div>');document.querySelectorAll("[data-retry]").forEach(b=>b.onclick=()=>{let [i,j]=b.dataset.retry.split("-").map(Number);chapter=i;question=j;review=false;selection=null;checked=false;notice="";render()})}
$("review").onclick=()=>{if(active==="首頁"||active==="數學"){openSubject("國文")}review=true;render()};
$("home").onclick=()=>openSubject("首頁");
render();
</script></body></html>
